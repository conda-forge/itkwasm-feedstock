{% set name = "itkwasm" %}
{% set version = "1.0b199" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/i/itkwasm/itkwasm-{{ version }}.tar.gz
  sha256: def5e620c99dc935537287120d3afc405dca71e54b57f1cb44f332bba063d257

# NOTE:
# This package depends at runtime on wasmtime-py, which includes
# platform-specific compiled shared libraries (_libwasmtime.so)
# linked against glibc. Therefore this package cannot be built
# as noarch.

build:
  number: 0
  script_env:
    - MACOSX_DEPLOYMENT_TARGET=10.15
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python
    - pip
    - hatchling
    - wasmtime-py
  run:
    - python
    - numpy
    - platformdirs
    - typing_extensions
    - wasmtime-py
    - importlib-metadata

test:
  imports:
    - itkwasm

about:
  summary: Python interface to itk-wasm WebAssembly (Wasm) modules.
  license: Apache-2.0
  license_file: LICENSE
  home: https://pypi.org/project/itkwasm/
  doc_url: https://docs.itk.org/projects/wasm/en/latest/

extra:
  recipe-maintainers:
    - khaled196
    - thewtex
